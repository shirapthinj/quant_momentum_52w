name: Daily Quant Momentum Runner

on:
  schedule:
    - cron: '15 10 * * 1-5'  # Mon-Fri at 3:45 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-momentum-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Execute Daily Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_momentum.py

      - name: Commit Updated Portfolio Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update tracking logs [skip ci]" || exit 0
          git push
